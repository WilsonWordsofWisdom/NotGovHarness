[project]
name = "notgovharness"
version = "0.0.0"
description = "Locally-runnable reference implementation of a complete agentic platform."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# guardrails-service's llm-guard==0.3.15 exact-pins json-repair<0.29 and regex==2024.7.24;
# agent-builder-service's crewai>=1.15 needs json-repair~=0.60.1 and regex~=2026.1.15 — no
# version of crewai (checked its whole release history) declares a range overlapping
# llm-guard's pins, so a single joint resolution is otherwise unsatisfiable. Both packages are
# mature, stable stdlib-adjacent libraries (regex is a drop-in re replacement; json-repair's
# public API is a single repair_json() function) — overriding llm-guard's overly narrow pin to
# crewai's newer range is the same class of fix as D-052's `transformers<5`, just in the other
# direction. Verified guardrails-service's own test suite (its llm_guard_layer tests
# specifically) still passes against the overridden versions before relying on this — D-075.
# crewai also narrowly pins mcp~=1.28.1, which drags the whole workspace's `mcp` down from
# 2.1.1 (mcp-skills-demo's own tests are written against 2.1.1's API) — this harness never
# exercises crewai's own MCP support (D-072: tool access goes through agent-gateway's REST API,
# not crewai-tools' MCPServerAdapter), so pinning `mcp` to what mcp-skills-demo already needs is
# safe from crewai's side; verified by re-running mcp-skills-demo's own tests + pyright against
# the override before relying on it.
override-dependencies = [
    "json-repair>=0.60.1,<0.61.0",
    "regex>=2026.1.15,<2026.2.0",
    "mcp>=2.1.1,<3",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]
# clients/* joins the workspace once the first generated client exists.

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "copier>=9",
    "openapi-python-client>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/platform-core/src", "packages/platform-testing/src"]
# Generated API clients are not hand-maintained; don't lint them.
extend-exclude = ["clients"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI uses callables (Depends/Query/...) in argument defaults by design.
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["packages", "services", "tools"]
exclude = ["clients", "**/.venv", "**/migrations"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services"]
# Test dirs have no __init__.py, so pytest's default "prepend" import mode needs every test file's
# basename unique across the whole workspace - every new service scaffolded from the copier
# template starts with a test_smoke.py, so that broke the moment a second one existed.
# importlib mode imports by fully-qualified path instead, sidestepping the collision.
addopts = "--import-mode=importlib"
