agent {
    data_dir = "/run/spire/data"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    trust_domain = "notgovharness"
    socket_path = "/run/spire/sockets/agent.sock"
    # Dev-only: skip out-of-band trust-bundle verification on first connect. A production
    # deployment distributes the server's bundle to the agent independently of the network path
    # being trusted; not built here — see the harness spec's non-goals.
    insecure_bootstrap = true
    join_token_file = "/run/spire/bootstrap/join_token"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {
        }
    }

    KeyManager "memory" {
        plugin_data {
        }
    }

    # Attests workloads by asking the Docker daemon about the calling process's container —
    # entries then select on docker:label:com.docker.compose.service:<name>, so registration
    # maps directly onto compose service names (see spire-registrar).
    WorkloadAttestor "docker" {
        plugin_data {
        }
    }
}
