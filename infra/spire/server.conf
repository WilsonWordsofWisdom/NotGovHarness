server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "notgovharness"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    socket_path = "/run/spire/server/private/api.sock"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }

    # join_token: the agent bootstraps with a one-time token instead of a cloud/k8s node
    # identity — the right fit for a single-node local reference platform. See
    # infra/spire/README.md for how the token gets from the server to the agent.
    NodeAttestor "join_token" {
        plugin_data {
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }
}
