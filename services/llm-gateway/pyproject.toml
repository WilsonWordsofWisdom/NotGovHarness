[project]
name = "llm-gateway"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = ["platform-core", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.uv.sources]
platform-core = { workspace = true }
