[project]
name = "mem0-service"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "mem0ai>=2.0",
    "fastembed>=0.4",
    "psycopg[binary,pool]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem0_service"]

[tool.uv.sources]
platform-core = { workspace = true }
