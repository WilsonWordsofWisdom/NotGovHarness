[project]
name = "approvals-service"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = ["platform-core", "temporalio>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approvals_service"]

[tool.uv.sources]
platform-core = { workspace = true }
