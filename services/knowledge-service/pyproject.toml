[project]
name = "knowledge-service"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "llama-index-core>=0.14",
    "llama-index-vector-stores-postgres>=0.9",
    "llama-index-embeddings-fastembed>=0.7",
    "llama-index-llms-openai-like>=0.8",
    "fastembed>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_service"]

[tool.uv.sources]
platform-core = { workspace = true }
