[project]
name = "example-service"
version = "0.1.0"
description = "Reference service that exercises the whole platform-core kit (Phase 0 proof)."
requires-python = ">=3.12"
dependencies = ["platform-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_service"]

[tool.uv.sources]
platform-core = { workspace = true }
