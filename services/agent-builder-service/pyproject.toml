[project]
name = "agent-builder-service"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "crewai>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_builder_service"]

[tool.uv.sources]
platform-core = { workspace = true }
