[project]
name = "identity-service"
version = "0.1.0"
description = "OAuth2 authorization server + trust anchor (Agent Identity harness)."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]

[tool.uv.sources]
platform-core = { workspace = true }
