[project]
name = "sandbox-service"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = ["platform-core", "docker>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_service"]

[tool.uv.sources]
platform-core = { workspace = true }
