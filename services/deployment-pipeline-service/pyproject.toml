[project]
name = "deployment-pipeline-service"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "temporalio>=1.8",
    "docker>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deployment_pipeline_service"]

[tool.uv.sources]
platform-core = { workspace = true }
