[project]
name = "evals-runner-service"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "deepeval>=4.2",
    "ragas>=0.4",
    # ragas declares langchain-community with no version bound; a fresh resolution picks a
    # LangChain-1.0-generation release that breaks ragas's own unconditional import of a class
    # that release moved elsewhere (D-079) -- pinned explicitly rather than left to float.
    "langchain-community<0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals_runner_service"]

[tool.uv.sources]
platform-core = { workspace = true }
