[project]
name = "mcp-skills-demo"
version = "0.1.0"
description = "A NotGovHarness service."
requires-python = ">=3.12"
dependencies = ["platform-core", "mcp>=1.2", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_skills_demo"]

[tool.uv.sources]
platform-core = { workspace = true }
