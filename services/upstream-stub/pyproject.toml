[project]
name = "upstream-stub"
version = "0.1.0"
description = "Trivial instrumented upstream, used to prove façade trace/identity propagation."
requires-python = ">=3.12"
dependencies = ["platform-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upstream_stub"]

[tool.uv.sources]
platform-core = { workspace = true }
