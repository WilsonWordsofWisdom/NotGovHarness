# NotGovHarness local platform stack.
# Phase 0 `core` profile: edge + Postgres + event backbone + tracing baseline (verified).
# `clickhouse` / `objectstore` profiles: reusable analytics DB + blob store (Observability harness
# adds langfuse-web/worker on top; later harnesses may reuse them directly).
# Later harnesses enable further profiles (identity, observability, vector, temporal).
# Project name comes from the directory (or set COMPOSE_PROJECT_NAME) for broad Compose compat.

services:
  traefik:
    image: traefik:v3.7.11
    profiles: ["core"]
    ports:
      - "80:80" # edge — services at http://localhost/<service>/...
      - "8080:8080" # dashboard (insecure, dev only)
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16
    profiles: ["core"]
    # Old Docker Engine (20.10.x) ships a seccomp profile that blocks syscalls (clone3, ...)
    # these modern images need. Relaxing seccomp is a local-dev workaround; the real fix is a
    # newer Docker Engine. Remove once on a current Docker Desktop.
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: ["core"]
    security_opt:
      - seccomp:unconfined
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      # Two listeners: external for host tools (localhost:9092), internal for other containers
      # (redpanda:29092) — a Kafka client is redirected to the advertised address, so containers
      # must be told a name they can resolve.
      - --kafka-addr=external://0.0.0.0:9092,internal://0.0.0.0:29092
      - --advertise-kafka-addr=external://localhost:9092,internal://redpanda:29092
    ports:
      - "9092:9092" # Kafka API (external, host)
      - "9644:9644" # admin

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ["core"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (services export here)
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["core"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI

  example-service:
    profiles: ["core"]
    # Same old-Docker seccomp workaround as postgres/redpanda: the 20.10.x profile blocks
    # thread creation (OTel resource detection spawns threads → "can't start new thread").
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/example-service/Dockerfile
    environment:
      SERVICE_NAME: example-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/example_service
      KAFKA_BROKERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      UPSTREAM_URL: http://upstream-stub:8000
      # SVID socket only exists once the `identity` profile's spire-agent has attested — see
      # svid.py. Not a depends_on: example-service/upstream-stub also run under `core` alone.
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
    volumes:
      - spiresockets:/run/spire/sockets:ro
    depends_on:
      - postgres
      - redpanda
      - otel-collector
      - upstream-stub
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.example.rule=PathPrefix(`/example`)"
      - "traefik.http.routers.example.entrypoints=web"
      - "traefik.http.routers.example.middlewares=example-stripprefix"
      - "traefik.http.middlewares.example-stripprefix.stripprefix.prefixes=/example"
      - "traefik.http.services.example.loadbalancer.server.port=8000"

  upstream-stub:
    profiles: ["core"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/upstream-stub/Dockerfile
    environment:
      SERVICE_NAME: upstream-stub
      ENV: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
    volumes:
      - spiresockets:/run/spire/sockets:ro
    depends_on:
      - otel-collector

  identity-service:
    profiles: ["identity"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      SERVICE_NAME: identity-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/identity
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8090:8000" # /oauth/token, /.well-known/jwks.json — published for skip-if-down tests
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  audit-service:
    profiles: ["audit"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    environment:
      SERVICE_NAME: audit-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/audit
      KAFKA_BROKERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8091:8000" # /audit/records, /audit/verify — published for skip-if-down tests
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redpanda:
        condition: service_started

  agent-registry:
    profiles: ["registry"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/agent-registry/Dockerfile
    environment:
      SERVICE_NAME: agent-registry
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/agent_registry
      OAUTH2_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8092:8000" # /agents, /agents/{name}[/{version}][/verify] — published for skip-if-down tests
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      identity-service:
        condition: service_started

  skill-registry:
    profiles: ["registry"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/skill-registry/Dockerfile
    environment:
      SERVICE_NAME: skill-registry
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/skill_registry
      OAUTH2_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: miniosecret123
      MINIO_BUCKET: skill-registry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8093:8000" # /skills, /skills/{name}[/{version}][/bundle] — published for skip-if-down tests
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
      identity-service:
        condition: service_started

  eval-registry:
    profiles: ["registry"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/eval-registry/Dockerfile
    environment:
      SERVICE_NAME: eval-registry
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/eval_registry
      OAUTH2_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: miniosecret123
      MINIO_BUCKET: eval-registry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8094:8000" # /suites, /suites/{name}[/{version}][/dataset] — published for skip-if-down tests
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
      identity-service:
        condition: service_started

  contextforge:
    # Backend for the Agent Gateway harness — never called directly by other services; only
    # agent-gateway (below) talks to it, using its own bootstrap admin credential (D-043: our
    # identity-service gates callers, ContextForge's credential stays a backend-only secret).
    image: ghcr.io/ibm/mcp-context-forge:latest
    profiles: ["gateway"]
    security_opt:
      - seccomp:unconfined
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg://platform:platform@postgres:5432/agent_gateway
      # Dev-only bootstrap secrets — never real production values, same posture as every other
      # local-dev credential in this compose file (Postgres/MinIO). PLATFORM_ADMIN_EMAIL must
      # NOT use a .local/.internal/etc TLD — ContextForge's email validator (via python
      # email-validator) rejects reserved/special-use domains outright (found live).
      JWT_SECRET_KEY: notgovharness-dev-jwt-secret-32chars-min
      AUTH_ENCRYPTION_SECRET: notgovharness-dev-auth-encryption-secret-32chars
      PLATFORM_ADMIN_EMAIL: admin@example.com
      PLATFORM_ADMIN_PASSWORD: changeme123
      # Otherwise the admin bootstrap account is forced through a "change your password" gate
      # on first login (found live) — irrelevant noise for a backend service credential that's
      # never used interactively.
      PASSWORD_CHANGE_ENFORCEMENT_ENABLED: "false"
      # ContextForge's SSRF protection blocks registering a gateway whose URL resolves to a
      # private/RFC1918 address by default (found live) — but every MCP server in this compose
      # network genuinely lives on one. This is the documented flag for exactly that case, not
      # a blanket bypass of SSRF protection (SSRF_BLOCKED_NETWORKS/_HOSTS still apply).
      SSRF_ALLOW_PRIVATE_NETWORKS: "true"
    # ContextForge's own admin UI/API, not fronted by Traefik — agent-gateway is the only
    # intended caller; published only for local debugging via the browser.
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mcp-skills-demo:
    # Exists so the Agent Gateway harness has something real to federate (D-044) — a minimal
    # MCP server wrapping Skill Registry's GET /skills. No identity gating: ContextForge calls
    # this directly (D-043 keeps our identity out of the ContextForge<->tool hop).
    profiles: ["gateway"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/mcp-skills-demo/Dockerfile
    environment:
      SERVICE_NAME: mcp-skills-demo
      ENV: dev
      SKILL_REGISTRY_URL: http://skill-registry:8000
    ports:
      - "9500:8000" # /mcp — published for local debugging with a real MCP client
    depends_on:
      skill-registry:
        condition: service_started

  agent-gateway:
    profiles: ["gateway"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/agent-gateway/Dockerfile
    environment:
      SERVICE_NAME: agent-gateway
      ENV: dev
      OAUTH2_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      CONTEXTFORGE_URL: http://contextforge:4444
      # Must match contextforge's own PLATFORM_ADMIN_EMAIL/_PASSWORD above.
      CONTEXTFORGE_ADMIN_EMAIL: admin@example.com
      CONTEXTFORGE_ADMIN_PASSWORD: changeme123
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8095:8000" # /mcp-servers, /tools[/{name}/call] — published for skip-if-down tests
    depends_on:
      otel-collector:
        condition: service_started
      identity-service:
        condition: service_started
      contextforge:
        condition: service_healthy

  # Temporal isn't one of the 16 harnesses — shared infra Approvals/HITL (Wave 3) and
  # Deployment Pipeline (Wave 4) build on, same relationship Postgres/Redpanda/MinIO already
  # have to their consumers (D-048). Real Postgres-backed server, not the CLI's ephemeral
  # start-dev mode, matching db-per-service on the shared Postgres container like everything
  # else already built.
  temporal-schema-setup:
    # One-shot: applies Temporal's own schema (main + visibility, its own architecture splits
    # them) via temporal-sql-tool, then exits — `temporal` below waits for it to complete
    # successfully rather than racing a server boot against an unmigrated database.
    image: temporalio/admin-tools:1.31.2
    profiles: ["temporal"]
    entrypoint: sh
    command: >
      -c "
      temporal-sql-tool --plugin postgres12 --endpoint postgres --port 5432 --user platform --password platform --database temporal setup-schema -v 0.0 &&
      temporal-sql-tool --plugin postgres12 --endpoint postgres --port 5432 --user platform --password platform --database temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned &&
      temporal-sql-tool --plugin postgres12 --endpoint postgres --port 5432 --user platform --password platform --database temporal_visibility setup-schema -v 0.0 &&
      temporal-sql-tool --plugin postgres12 --endpoint postgres --port 5432 --user platform --password platform --database temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
      "
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.31.2
    profiles: ["temporal"]
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: platform
      POSTGRES_PWD: platform
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      # The server refuses to start at all without this file existing (found live) — empty is
      # a valid, complete dynamic config for this reference deployment.
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    volumes:
      - ./infra/temporal/dynamic_config.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    ports:
      - "7233:7233" # gRPC frontend — published for skip-if-down tests (real temporalio SDK)
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  temporal-namespace-setup:
    # One-shot: registers the "default" namespace every workflow in this reference platform
    # uses — idempotent (a re-run against an already-registered namespace is a no-op, not an
    # error worth failing compose over).
    image: temporalio/admin-tools:1.31.2
    profiles: ["temporal"]
    entrypoint: sh
    command: -c "temporal operator namespace create --address temporal:7233 -n default || true"
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    profiles: ["temporal"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8081
    ports:
      - "8081:8080" # Web UI — 8080 is already Traefik's dashboard port on the host
    depends_on:
      temporal:
        condition: service_healthy

  # Approvals/HITL (Wave 3, D-015) — approve/edit/reject gates via a real Temporal workflow
  # (ApprovalWorkflow), not a plain Postgres status column. Two containers share one image:
  # the API (approvals-service) starts/signals workflows; the worker actually executes them
  # (and persists their outcome back to Postgres via an activity) — the first non-HTTP-server
  # long-running process in this stack.
  approvals-service:
    profiles: ["approvals"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/approvals-service/Dockerfile
    environment:
      SERVICE_NAME: approvals-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/approvals
      OAUTH2_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      TEMPORAL_ADDRESS: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8096:8000" # /approvals, /ui — published for skip-if-down tests
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      identity-service:
        condition: service_started
      temporal:
        condition: service_healthy

  approvals-worker:
    profiles: ["approvals"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/approvals-service/Dockerfile
    command: ["python", "-m", "approvals_service.worker"]
    environment:
      SERVICE_NAME: approvals-worker
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/approvals
      TEMPORAL_ADDRESS: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # Sandbox (Wave 3, D-014, redesigned per D-050) — isolated code execution for agent-generated
  # code. Real E2B needs Firecracker microVMs on a Nomad/Consul cluster, provisioned via
  # Terraform on GCP/AWS — not something this single-machine docker-compose reference can run
  # (see the harness design doc). This executes on plain, ephemeral Docker containers instead
  # (--network none, memory/CPU limits, killed at a timeout), which is why it needs the *host's*
  # Docker socket below — real host privilege, disclosed in D-050: the isolation boundary this
  # buys is executed-code-vs-host, not sandbox-service-vs-host.
  sandbox-service:
    profiles: ["sandbox"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/sandbox-service/Dockerfile
    environment:
      SERVICE_NAME: sandbox-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/sandbox
      OAUTH2_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8097:8000" # /executions — published for skip-if-down tests
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      identity-service:
        condition: service_started

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.1
    container_name: spire-server # referenced by name from spire-bootstrap's `docker exec`
    profiles: ["identity"]
    # Image defaults to UID 1000, but a fresh named volume mounts root-owned — sqlite can't
    # create its file there otherwise. Root inside a container is still namespace-isolated;
    # matches this repo's existing local-dev-only pragmatism (Postgres/MinIO dev creds, etc).
    user: "0:0"
    volumes:
      - ./infra/spire/server.conf:/run/spire/config/server.conf:ro
      - spiredata:/run/spire/data
    command: ["-config", "/run/spire/config/server.conf"]
    healthcheck:
      test:
        [
          "CMD",
          "/opt/spire/bin/spire-server",
          "healthcheck",
          "-socketPath",
          "/run/spire/server/private/api.sock",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: generates the agent's join token + registers workload entries, then exits. See
  # infra/spire/bootstrap.sh for why this runs via `docker exec` into spire-server rather than
  # calling the spire-server binary directly (its image ships no shell).
  spire-bootstrap:
    image: docker:cli
    profiles: ["identity"]
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/spire/bootstrap.sh:/bootstrap.sh:ro
      - spirebootstrap:/run/spire/bootstrap
    entrypoint: ["sh", "/bootstrap.sh"]

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.1
    profiles: ["identity"]
    # The Docker workload attestor resolves a caller's PID (from the Workload API socket's peer
    # credentials) to a container via /proc/<pid>/cgroup on its *own* filesystem view — without
    # this, that PID is meaningless to spire-agent (it's in the calling container's own PID
    # namespace). The kernel translates peer credentials into the receiver's namespace view
    # automatically for nested namespaces, so only the agent needs this, not the workloads.
    pid: host
    depends_on:
      spire-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./infra/spire/agent.conf:/run/spire/config/agent.conf:ro
      - spireagentdata:/run/spire/data
      - spiresockets:/run/spire/sockets
      - spirebootstrap:/run/spire/bootstrap:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker workload attestor
    command: ["-config", "/run/spire/config/agent.conf"]

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: ["clickhouse"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      TZ: UTC
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - clickhouselogs:/var/log/clickhouse-server
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native protocol
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    # minio/minio on Docker Hub is archived (MinIO stopped publishing free images, Oct 2025).
    # Chainguard's image only reliably serves `latest` on the free tier — pinned historical tags
    # need an authenticated account — so this is a deliberate exception to pinning every image.
    image: cgr.dev/chainguard/minio:latest
    profiles: ["objectstore"]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret123
    ports:
      - "9090:9000" # S3 API
      - "9091:9001" # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  redis:
    image: redis:7
    profiles: ["observability"]
    command: ["--requirepass", "myredissecret", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myredissecret", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Langfuse env surface is ~60 vars upstream; only what this reference deployment needs is set
  # here (dev-fixed secrets/keys, matching the platform/platform Postgres posture). `${VAR:-default}`
  # substitution is used for this pair of services (not this file's usual literal-value style) to
  # stay close to Langfuse's own tested reference compose — see the Observability harness spec.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3000
