# NotGovHarness local platform stack.
# Phase 0 `core` profile: edge + Postgres + event backbone + tracing baseline (verified).
# `clickhouse` / `objectstore` profiles: reusable analytics DB + blob store (Observability harness
# adds langfuse-web/worker on top; later harnesses may reuse them directly).
# Later harnesses enable further profiles (identity, observability, vector, temporal).
# Project name comes from the directory (or set COMPOSE_PROJECT_NAME) for broad Compose compat.

services:
  traefik:
    image: traefik:v3.7.11
    profiles: ["core"]
    ports:
      - "80:80" # edge — services at http://localhost/<service>/...
      - "8080:8080" # dashboard (insecure, dev only)
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16
    profiles: ["core"]
    # Old Docker Engine (20.10.x) ships a seccomp profile that blocks syscalls (clone3, ...)
    # these modern images need. Relaxing seccomp is a local-dev workaround; the real fix is a
    # newer Docker Engine. Remove once on a current Docker Desktop.
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: ["core"]
    security_opt:
      - seccomp:unconfined
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      # Two listeners: external for host tools (localhost:9092), internal for other containers
      # (redpanda:29092) — a Kafka client is redirected to the advertised address, so containers
      # must be told a name they can resolve.
      - --kafka-addr=external://0.0.0.0:9092,internal://0.0.0.0:29092
      - --advertise-kafka-addr=external://localhost:9092,internal://redpanda:29092
    ports:
      - "9092:9092" # Kafka API (external, host)
      - "9644:9644" # admin

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ["core"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (services export here)
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["core"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI

  example-service:
    profiles: ["core"]
    # Same old-Docker seccomp workaround as postgres/redpanda: the 20.10.x profile blocks
    # thread creation (OTel resource detection spawns threads → "can't start new thread").
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/example-service/Dockerfile
    environment:
      SERVICE_NAME: example-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/example_service
      KAFKA_BROKERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      UPSTREAM_URL: http://upstream-stub:8000
      # SVID socket only exists once the `identity` profile's spire-agent has attested — see
      # svid.py. Not a depends_on: example-service/upstream-stub also run under `core` alone.
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
    volumes:
      - spiresockets:/run/spire/sockets:ro
    depends_on:
      - postgres
      - redpanda
      - otel-collector
      - upstream-stub
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.example.rule=PathPrefix(`/example`)"
      - "traefik.http.routers.example.entrypoints=web"
      - "traefik.http.routers.example.middlewares=example-stripprefix"
      - "traefik.http.middlewares.example-stripprefix.stripprefix.prefixes=/example"
      - "traefik.http.services.example.loadbalancer.server.port=8000"

  upstream-stub:
    profiles: ["core"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/upstream-stub/Dockerfile
    environment:
      SERVICE_NAME: upstream-stub
      ENV: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
    volumes:
      - spiresockets:/run/spire/sockets:ro
    depends_on:
      - otel-collector

  identity-service:
    profiles: ["identity"]
    security_opt:
      - seccomp:unconfined
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      SERVICE_NAME: identity-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/identity
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8090:8000" # /oauth/token, /.well-known/jwks.json — published for skip-if-down tests
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.1
    container_name: spire-server # referenced by name from spire-bootstrap's `docker exec`
    profiles: ["identity"]
    # Image defaults to UID 1000, but a fresh named volume mounts root-owned — sqlite can't
    # create its file there otherwise. Root inside a container is still namespace-isolated;
    # matches this repo's existing local-dev-only pragmatism (Postgres/MinIO dev creds, etc).
    user: "0:0"
    volumes:
      - ./infra/spire/server.conf:/run/spire/config/server.conf:ro
      - spiredata:/run/spire/data
    command: ["-config", "/run/spire/config/server.conf"]
    healthcheck:
      test:
        [
          "CMD",
          "/opt/spire/bin/spire-server",
          "healthcheck",
          "-socketPath",
          "/run/spire/server/private/api.sock",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: generates the agent's join token + registers workload entries, then exits. See
  # infra/spire/bootstrap.sh for why this runs via `docker exec` into spire-server rather than
  # calling the spire-server binary directly (its image ships no shell).
  spire-bootstrap:
    image: docker:cli
    profiles: ["identity"]
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/spire/bootstrap.sh:/bootstrap.sh:ro
      - spirebootstrap:/run/spire/bootstrap
    entrypoint: ["sh", "/bootstrap.sh"]

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.1
    profiles: ["identity"]
    depends_on:
      spire-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./infra/spire/agent.conf:/run/spire/config/agent.conf:ro
      - spireagentdata:/run/spire/data
      - spiresockets:/run/spire/sockets
      - spirebootstrap:/run/spire/bootstrap:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker workload attestor
    command: ["-config", "/run/spire/config/agent.conf"]

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: ["clickhouse"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      TZ: UTC
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - clickhouselogs:/var/log/clickhouse-server
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native protocol
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    # minio/minio on Docker Hub is archived (MinIO stopped publishing free images, Oct 2025).
    # Chainguard's image only reliably serves `latest` on the free tier — pinned historical tags
    # need an authenticated account — so this is a deliberate exception to pinning every image.
    image: cgr.dev/chainguard/minio:latest
    profiles: ["objectstore"]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret123
    ports:
      - "9090:9000" # S3 API
      - "9091:9001" # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  redis:
    image: redis:7
    profiles: ["observability"]
    command: ["--requirepass", "myredissecret", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myredissecret", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Langfuse env surface is ~60 vars upstream; only what this reference deployment needs is set
  # here (dev-fixed secrets/keys, matching the platform/platform Postgres posture). `${VAR:-default}`
  # substitution is used for this pair of services (not this file's usual literal-value style) to
  # stay close to Langfuse's own tested reference compose — see the Observability harness spec.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://platform:platform@postgres:5432/langfuse
      SALT: notgovharness-dev-salt
      ENCRYPTION_KEY: "859b2019e55e97c286ba56213d7d8bc8659c2bc700c39b3e0da9e59fcf5b5727"
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret123
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret123
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: myredissecret

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000" # UI + public API — direct (not via Traefik; see harness spec)
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: notgovharness-dev-nextauth-secret
      # Browser-reachable, unlike the worker's internal minio:9000 endpoint above.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_INIT_ORG_ID: notgovharness
      LANGFUSE_INIT_ORG_NAME: NotGovHarness
      LANGFUSE_INIT_PROJECT_ID: platform
      LANGFUSE_INIT_PROJECT_NAME: Platform
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-00000000-0000-4000-8000-000000000000
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-00000000-0000-4000-8000-000000000000
      LANGFUSE_INIT_USER_EMAIL: dev@notgovharness.local
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: devpassword123

volumes:
  pgdata:
  clickhousedata:
  clickhouselogs:
  miniodata:
  redisdata:
  spiredata:
  spireagentdata:
  spiresockets:
  spirebootstrap:
