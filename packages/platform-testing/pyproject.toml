[project]
name = "platform-testing"
version = "0.1.0"
description = "Shared pytest fixtures (ephemeral infra, HTTP client, event probe) for NotGovHarness."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "testcontainers>=4.8",
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_testing"]

[tool.uv.sources]
platform-core = { workspace = true }
